[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Placeholder — overridden at runtime by app.py (run_migrations) or by the
# DATABASE_URL environment variable for CLI usage.
sqlalchemy.url = sqlite:///insurance.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S